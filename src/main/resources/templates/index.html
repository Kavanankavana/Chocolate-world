<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Home')}"></head>
<body>
<header th:replace="~{fragments :: header(${places})}"></header>

<main>
    <div th:replace="~{fragments :: alerts}"></div>

    <section class="hero">
        <h1>Chocolate, by where it's from</h1>
        <p>Browse handcrafted chocolates from Brussels to Kochi. Pick a type to filter.</p>

        <!-- The filter looks like a chocolate bar: one square per type -->
        <div class="bar" role="group" aria-label="Filter by type">
            <a href="/" th:classappend="${selectedType == null} ? 'active'" class="sq t-all">All</a>
            <a href="/?type=Dark"  th:classappend="${selectedType == 'Dark'} ? 'active'"  class="sq t-dark">Dark</a>
            <a href="/?type=Milk"  th:classappend="${selectedType == 'Milk'} ? 'active'"  class="sq t-milk">Milk</a>
            <a href="/?type=White" th:classappend="${selectedType == 'White'} ? 'active'" class="sq t-white">White</a>
            <a href="/?type=Ruby"  th:classappend="${selectedType == 'Ruby'} ? 'active'"  class="sq t-ruby">Ruby</a>
        </div>
    </section>

    <p th:if="${chocolates.isEmpty()}" class="empty">
        No chocolates of this type yet. <a href="/chocolates/new">Add one</a>.
    </p>

    <section class="grid">
        <article th:each="c : ${chocolates}" class="card">
            <div class="card-image-wrap">
                <img th:src="${c.imageUrl != null and !c.imageUrl.isEmpty() ? c.imageUrl : '/images/default_' + #strings.toLowerCase(c.type) + '.jpg'}"
                     th:alt="${c.name}"
                     class="card-img"
                     loading="lazy">
                <span class="type-pill" th:classappend="'t-' + ${#strings.toLowerCase(c.type)}" th:text="${c.type}">Dark</span>
            </div>
            <div class="stripe" th:classappend="'t-' + ${#strings.toLowerCase(c.type)}"></div>
            <div class="card-body">
                <h2 th:text="${c.name}">Chocolate name</h2>
                <p class="meta">
                    from
                    <a th:href="@{/places/{id}(id=${c.place.id})}"
                       th:text="${c.place.name} + ', ' + ${c.place.country}">Brussels, Belgium</a>
                </p>
                <p th:text="${c.description}">Description</p>
            </div>
            <div class="card-foot">
                <span class="price" th:text="'₹' + ${#numbers.formatDecimal(c.price, 1, 0)} + ' / 100 g'">₹500 / 100 g</span>
                <form th:action="@{/chocolates/{id}/delete(id=${c.id})}" method="post">
                    <button type="submit" class="link-btn">Delete</button>
                </form>
            </div>
        </article>
    </section>
</main>
</body>
</html>
